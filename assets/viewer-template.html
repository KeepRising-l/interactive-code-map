        row.className = `ai-msg ${m.role}${m.isError ? ' error' : ''}`;
        if (m.role === 'user' && m.quotes && m.quotes.length) {
          const qWrap = document.createElement('div');
          qWrap.className = 'ai-msg-quotes';
          m.quotes.forEach(q => {
            const b = document.createElement('span');
            b.className = 'q-badge-mini';
            b.textContent = q.type === 'card' ? '📎 ' + (cardMap.get(q.cardId)?.title || q.cardId) : '📄 ' + q.fileKey;
            b.addEventListener('click', () => {
              if (q.type === 'card') { selectCard(q.cardId, true); centerOnCard(cardMap.get(q.cardId)); }
              else { drawerEl.classList.add('open'); syncLayoutOffsets(); renderCodeFile(q.fileKey, [], null, 'normal'); }
            });
            qWrap.appendChild(b);
          });
          row.appendChild(qWrap);
        }
        const bubble = document.createElement('div');
        bubble.className = 'ai-bubble';
        if (m.role === 'user') bubble.textContent = m.text;
        else bubble.innerHTML = renderAiMarkdown(m.text);

        if (m.isReport && m.text && !m.isError) {
          const acts = document.createElement('div');
          acts.className = 'report-actions';
          const dl = document.createElement('button');
          dl.className = 'btn btn-sm';
          dl.textContent = '⬇️ 导出 Markdown 报告';
          dl.addEventListener('click', () => downloadText((DATA.projectTitle || 'codemap') + '-学习诊断报告.md', m.text, 'text/markdown'));
          acts.appendChild(dl);
          bubble.appendChild(acts);
        }
        if (m.isError && m.retryInfo) {
          const acts = document.createElement('div');
          acts.className = 'msg-actions';
          const retryBtn = document.createElement('button');
          retryBtn.className = 'btn btn-sm';
          retryBtn.textContent = '🔄 重试';
          retryBtn.addEventListener('click', () => retryFailedTurn(msgIdx));
          acts.appendChild(retryBtn);
          bubble.appendChild(acts);
        }
        row.appendChild(bubble);
        aiMessagesEl.appendChild(row);
      });
      aiMessagesEl.scrollTop = aiMessagesEl.scrollHeight;
    }

    function validateConfigObject(cfg) {
      if (!cfg.baseUrl || !cfg.model) return '请先填写 Base URL 与 Model。';
      if (!isLoopbackUrl(cfg.baseUrl) && !cfg.apiKey) return '非本机地址需要填写 API Key。';
      return '';
    }

    function ensureConfigOrPrompt() {
      const cfg = loadConfig();
      const problem = validateConfigObject(cfg);
      if (problem) {
        document.getElementById('cfgBaseUrl').value = cfg.baseUrl || '';
        document.getElementById('cfgApiKey').value = cfg.apiKey || '';
        document.getElementById('cfgModel').value = cfg.model || '';
        document.getElementById('aiConfigBox').classList.add('open');
        openAiPanel();
        const statusEl = document.getElementById('cfgTestStatus');
        statusEl.className = 'cfg-status err';
        statusEl.textContent = problem + '（仅存本地浏览器，不写进 HTML）';
        return null;
      }
      return cfg;
    }

    async function runChatTurn(userText, quotes, apiMsgs, isReport = false, preCheckedCfg = null) {
      const cfg = preCheckedCfg || ensureConfigOrPrompt();
      if (!cfg || state.abortCtrl) return;

      const userEntry = { role: 'user', text: userText, quotes: quotes.slice(), ts: Date.now(), isReport };
      study.messages.push(userEntry);
      if (!isReport) {
        quotes.forEach(q => {
          if (q.type === 'card') {
            study.cardQuestions[q.cardId] = study.cardQuestions[q.cardId] || [];
            study.cardQuestions[q.cardId].push(userText.slice(0, 120));
          } else if (q.type === 'file') {
            study.fileQuestions[q.fileKey] = study.fileQuestions[q.fileKey] || [];
            study.fileQuestions[q.fileKey].push(userText.slice(0, 120));
          }
        });
      }
      const assistantEntry = { role: 'assistant', text: '', ts: Date.now(), isReport };
      study.messages.push(assistantEntry);
      saveStudy();
      renderMessages();

      state.abortCtrl = new AbortController();
      aiSendBtn.style.display = 'none';
      aiStopBtn.style.display = 'inline-flex';
      const bubbles = aiMessagesEl.querySelectorAll('.ai-msg.assistant .ai-bubble');
      const liveBubble = bubbles[bubbles.length - 1];
      let receivedContent = false;
      let reasoningShown = false;

      try {
        await streamOpenAiChat(
          cfg,
          apiMsgs,
          delta => {
            receivedContent = true;
            assistantEntry.text += delta;
            liveBubble.innerHTML = renderAiMarkdown(assistantEntry.text);
            aiMessagesEl.scrollTop = aiMessagesEl.scrollHeight;
          },
          state.abortCtrl.signal,
          () => {
            if (!receivedContent && !reasoningShown) {
              reasoningShown = true;
              liveBubble.innerHTML = '<em>模型思考中...</em>';
            }
          }
        );
        compactOldMemoryIfNeeded();
      } catch (err) {
        if (err.name === 'AbortError') {
          assistantEntry.text += '\n\n*[已手动停止生成]*';
        } else {
          assistantEntry.isError = true;
          assistantEntry.retryInfo = { userText, quotes: quotes.slice(), isReport };
          let tip = '';
          if (err instanceof TypeError) {
            tip = state.proxyReady
              ? '（本地代理 serve_map.py 连接中断或已退出，请重新双击同目录「*-AI导师.bat」启动服务）'
              : '（浏览器 CORS 跨域拦截或目标网关未启动——请双击同目录「*-AI导师.bat」通过本机同源代理打开即可正常流式对话）';
          }
          assistantEntry.text += `${assistantEntry.text ? '\n\n' : ''}**[调用失败]** ${err.message} ${tip}`;
        }
      } finally {
        state.abortCtrl = null;
        aiSendBtn.style.display = 'inline-flex';
        aiStopBtn.style.display = 'none';
        saveStudy();
        renderMessages();
      }
    }

    async function retryFailedTurn(errMsgIdx) {
      if (state.abortCtrl) return;
      const errEntry = study.messages[errMsgIdx];
      if (!errEntry || !errEntry.isError || !errEntry.retryInfo) return;
      const info = errEntry.retryInfo;
      const cfg = ensureConfigOrPrompt();
      if (!cfg) return;
      const prev = study.messages[errMsgIdx - 1];
      if (prev && prev.role === 'user' && prev.text === info.userText) {
        study.messages.splice(errMsgIdx - 1, 2);
      } else {
        study.messages.splice(errMsgIdx, 1);
      }
      saveStudy();
      if (info.isReport) {
        await generateDiagnosisReport();
      } else {
        const apiMsgs = buildApiMessages(info.userText, info.quotes || []);
        await runChatTurn(info.userText, info.quotes || [], apiMsgs, false, cfg);
      }
    }

    async function sendUserMessage() {
      const text = aiInputEl.value.trim();
      if (!text || state.abortCtrl) return;
      const cfg = ensureConfigOrPrompt();
      if (!cfg) return;
      const quotes = state.quotes.slice();
      const apiMsgs = buildApiMessages(text, quotes);
      aiInputEl.value = '';
      state.quotes = [];
      renderQuoteTray();
      await runChatTurn(text, quotes, apiMsgs, false, cfg);
    }

    // Layer 4: Weakness Diagnosis Report Generator
    async function generateDiagnosisReport() {
      openAiPanel();
      if (state.abortCtrl) return;
      const cfg = ensureConfigOrPrompt();
      if (!cfg) return;

      const unviewed = [];
      const highFreq = [];
      DATA.chains.forEach(ch => {
        const chCards = DATA.cards.filter(c => c.chainId === ch.id);
        chCards.forEach(c => {
          if (!study.cardViews[c.id]) unviewed.push(`${ch.name} -> ${c.title}`);
          const qs = study.cardQuestions[c.id] || [];
          if (qs.length) highFreq.push({ title: c.title, file: c.file, ranges: formatRanges(c.ranges), qs });
        });
      });
      const fileHot = Object.entries(study.fileQuestions).map(([k, qs]) => `${k}（被问 ${qs.length} 次：${qs.join(' / ')}）`);
      const recentQA = study.messages
        .filter(m => !m.isReport && m.role === 'user')
        .slice(-15)
        .map((m, i) => `${i + 1}. ${m.text}`)
        .join('\n');

      const dossier = `以下是用户学习《${DATA.projectTitle || ''}》的真实轨迹数据：
- 总卡片数：${DATA.cards.length}，已点开探索：${Object.keys(study.cardViews).length} 张
- 尚未探索的盲区卡片（节选前 20 张）：${unviewed.slice(0, 20).join('；') || '已全部探索！'}
- 按卡片统计的用户追问明细：${highFreq.map(h => `\n  • ${h.title} (${h.file} ${h.ranges}) [追问 ${h.qs.length} 次]：${h.qs.join(' | ')}`).join('') || '暂无卡片定向追问'}
- 按文件统计的用户追问：${fileHot.join('；') || '无'}
- 场景剧本探索深度：${(DATA.scenarios || []).map(s => `${s.name}（走到第 ${study.scenarioMaxStep[s.id] || 0}/${(s.steps || []).length} 步）`).join('；') || '无'}
- 用户近期全部提问列表：\n${recentQA || '（用户尚未提具体问题，请结合未探索盲区和核心难点生成重点攻克指南）'}

请严格根据以上学习数据生成一份《个人源码学习薄弱点诊断报告》，按以下 4 节输出 Markdown：
### 1. 学习覆盖度总览（点出已掌握/已走过的链路）
### 2. 薄弱环节精准诊断（重点分析多次追问的难点与未覆盖盲区）
### 3. 建议优先回看的 3 张核心卡片（写出精确卡片名、文件名与行号）
### 4. 针对薄弱点的 3 道面试自测题（附简明参考答法要点）`;

      const apiMsgs = [
        { role: 'system', content: buildSystemPrompt() },
        { role: 'user', content: dossier }
      ];
      await runChatTurn('📊 请结合我的浏览与提问记录，生成《学习薄弱点诊断报告》', [], apiMsgs, true, cfg);
    }

    function downloadText(filename, content, mime) {
      const blob = new Blob([content], { type: mime + ';charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    // ── 9. Search & Toolbar Bindings ──
    function updateSearchFilter() {
      const q = searchInput.value.trim().toLowerCase();
      document.querySelectorAll('.node-group').forEach(el => {
        if (!q) { el.style.opacity = ''; return; }
        const c = cardMap.get(el.dataset.id);
        const hay = `${c.title} ${c.subtitle || ''} ${c.file || ''} ${c.note || ''} ${c.interview || ''}`.toLowerCase();
        el.style.opacity = hay.includes(q) ? '1' : '0.16';
      });
    }
    searchInput.addEventListener('input', updateSearchFilter);
    searchInput.addEventListener('keydown', ev => {
      if (ev.key === 'Enter') {
        const q = searchInput.value.trim().toLowerCase();
        if (!q) return;
        const hit = DATA.cards.find(c => `${c.title} ${c.subtitle || ''} ${c.file || ''} ${c.note || ''} ${c.interview || ''}`.toLowerCase().includes(q));
        if (hit) {
          if (state.activeChainId !== 'ALL' && state.hideOtherChains && hit.chainId !== state.activeChainId) activateChain('ALL');
          selectCard(hit.id, true);
          centerOnCard(hit);
        }
      }
    });

    otherModeBtn.addEventListener('click', () => {
      state.hideOtherChains = !state.hideOtherChains;
      renderTopBars(); renderScene(); fitToView();
    });
    document.getElementById('zoomInBtn').addEventListener('click', () => { state.scale = Math.min(2.2, state.scale * 1.18); applyTransform(); });
    document.getElementById('zoomOutBtn').addEventListener('click', () => { state.scale = Math.max(0.18, state.scale * 0.85); applyTransform(); });
    document.getElementById('fitBtn').addEventListener('click', () => fitToView());

    document.getElementById('toggleDrawerBtn').addEventListener('click', () => {
      const isOpen = drawerEl.classList.toggle('open');
      drawerEl.setAttribute('aria-hidden', String(!isOpen));
      syncLayoutOffsets();
      if (isOpen && !state.selectedCardId && state.currentFile) renderCodeFile(state.currentFile, [], null, 'normal');
    });
    document.getElementById('closeDrawerBtn').addEventListener('click', () => {
      drawerEl.classList.remove('open'); drawerEl.setAttribute('aria-hidden', 'true'); syncLayoutOffsets();
    });
    document.getElementById('wideLeftBtn').addEventListener('click', () => {
      const w = drawerEl.classList.toggle('wide');
      document.getElementById('wideLeftBtn').textContent = w ? '窄版' : '加宽';
      syncLayoutOffsets();
    });
    document.getElementById('quoteCardBtn').addEventListener('click', () => {
      if (state.selectedCardId) addQuote({ type: 'card', cardId: state.selectedCardId });
      else if (state.currentFile) addQuote({ type: 'file', fileKey: state.currentFile });
      openAiPanel();
    });

    document.getElementById('toggleAiBtn').addEventListener('click', () => {
      const isOpen = aiPanelEl.classList.toggle('open');
      aiPanelEl.setAttribute('aria-hidden', String(!isOpen));
      syncLayoutOffsets();
    });
    document.getElementById('closeAiBtn').addEventListener('click', () => {
      aiPanelEl.classList.remove('open'); aiPanelEl.setAttribute('aria-hidden', 'true'); syncLayoutOffsets();
    });
    document.getElementById('wideRightBtn').addEventListener('click', () => {
      const w = aiPanelEl.classList.toggle('wide');
      document.getElementById('wideRightBtn').textContent = w ? '窄版' : '加宽';
      syncLayoutOffsets();
    });

    document.getElementById('aiConfigBtn').addEventListener('click', () => {
      const box = document.getElementById('aiConfigBox');
      const cfg = loadConfig();
      document.getElementById('cfgBaseUrl').value = cfg.baseUrl || '';
      document.getElementById('cfgApiKey').value = cfg.apiKey || '';
      document.getElementById('cfgModel').value = cfg.model || '';
      document.getElementById('cfgTestStatus').textContent = '';
      document.getElementById('cfgTestStatus').className = 'cfg-status';
      box.classList.toggle('open');
    });
    document.getElementById('testCfgBtn').addEventListener('click', testConnection);
    document.getElementById('saveCfgBtn').addEventListener('click', () => {
      saveConfig({
        baseUrl: document.getElementById('cfgBaseUrl').value.trim(),
        apiKey: document.getElementById('cfgApiKey').value.trim(),
        model: document.getElementById('cfgModel').value.trim()
      });
      document.getElementById('aiConfigBox').classList.remove('open');
    });

    document.getElementById('diagReportBtn').addEventListener('click', generateDiagnosisReport);
    document.getElementById('meterDiagLink').addEventListener('click', generateDiagnosisReport);

    document.getElementById('exportStudyBtn').addEventListener('click', () => {
      downloadText((DATA.projectTitle || 'codemap') + '-study-backup.json', JSON.stringify(study, null, 2), 'application/json');
    });
    document.getElementById('importStudyBtn').addEventListener('click', () => document.getElementById('importFileInput').click());
    document.getElementById('importFileInput').addEventListener('change', async ev => {
      const f = ev.target.files[0];
      ev.target.value = '';
      if (!f) return;
      try {
        const imported = JSON.parse(await f.text());
        if (!imported || !Array.isArray(imported.messages)) throw new Error('格式不正确');
        study = Object.assign(emptyStudy(), imported);
        saveStudy();
        renderMessages();
      } catch (e) {
        alert('导入备份失败：' + e.message);
      }
    });

    document.getElementById('clearAiBtn').addEventListener('click', () => {
      if (!confirm('确认清空当前对话消息记录吗？（卡片探索统计将保留用于诊断报告）')) return;
      study.messages = [];
      study.memorySummary = '';
      saveStudy();
      renderMessages();
    });

    aiSendBtn.addEventListener('click', sendUserMessage);
    aiStopBtn.addEventListener('click', () => { if (state.abortCtrl) state.abortCtrl.abort(); });
    aiInputEl.addEventListener('keydown', ev => {
      if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); sendUserMessage(); }
    });

    function stepCard(delta) {
      if (!state.selectedCardId) { selectCard(DATA.cards[0].id, true); return; }
      const cur = cardMap.get(state.selectedCardId);
      const pool = cur.file
        ? DATA.cards.filter(c => c.file === cur.file)
        : DATA.cards.filter(c => c.chainId === cur.chainId);
      const i = pool.findIndex(c => c.id === cur.id);
      const next = pool[(i + delta + pool.length) % pool.length];
      selectCard(next.id, true);
      centerOnCard(next);
    }
    document.getElementById('prevCardBtn').addEventListener('click', () => stepCard(-1));
    document.getElementById('nextCardBtn').addEventListener('click', () => stepCard(1));

    window.addEventListener('keydown', ev => {
      const tag = document.activeElement && document.activeElement.tagName;
      if (ev.key === 'Escape') {
        if (state.armedCardId) { state.armedCardId = null; renderScene(); return; }
        drawerEl.classList.remove('open'); drawerEl.setAttribute('aria-hidden', 'true');
        syncLayoutOffsets();
        return;
      }
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      if (ev.key === 'ArrowLeft') {
        if (state.activeScenarioId) jumpToScenarioStep(state.scenarioStepIdx - 1, true);
        else if (state.activeChainId !== 'ALL') jumpToTourStep(state.tourStepIdx - 1);
      } else if (ev.key === 'ArrowRight') {
        if (state.activeScenarioId) jumpToScenarioStep(state.scenarioStepIdx + 1, true);
        else if (state.activeChainId !== 'ALL') jumpToTourStep(state.tourStepIdx + 1);
      }
    });

    // Init
    renderTopBars();
    renderFileTabs();
    renderScene();
    renderMessages();
    updateStudyMeter();
    fitToView();
    detectLocalProxy();
  </script>
</body>
</html>
